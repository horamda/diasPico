<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ingresar — Portal_Logistica</title>
{% include 'partials/head_icons.html' %}
<link rel="stylesheet" href="/static/design-system.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  min-height:100vh;background:var(--bg);color:var(--txt);
  font-family:var(--sans);display:grid;place-items:center;padding:20px;
  background-image:radial-gradient(circle at 15% 50%, rgba(91,141,238,.07), transparent 50%),
                   radial-gradient(circle at 85% 30%, rgba(245,166,35,.05), transparent 40%);
}
.card{
  width:min(400px,100%);
  background:var(--surf);border:1px solid var(--brd);border-radius:12px;
  overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.4);
}
.card-header{
  padding:24px 28px 20px;border-bottom:1px solid var(--brd);
  background:var(--surf2);
}
.logo-row{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.badge{
  background:var(--acc);color:#000;font-family:var(--mono);
  font-size:10px;font-weight:700;padding:4px 8px;border-radius:4px;letter-spacing:1px;
}
.logo-text{font-size:13px;font-weight:600;color:var(--muted);}
.card-header h1{font-size:20px;font-weight:600;margin-bottom:4px;}
.card-header p{font-size:12px;color:var(--muted);}

.card-body{padding:24px 28px;}
form{display:flex;flex-direction:column;gap:16px;}
label{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;
  letter-spacing:.5px;margin-bottom:5px;}
input[type=text],input[type=password]{
  width:100%;background:var(--surf2);border:1px solid var(--brd);
  color:var(--txt);padding:10px 12px;border-radius:6px;font-size:13px;
  font-family:var(--sans);outline:none;transition:border-color .12s;
}
input:focus{border-color:var(--acc);}
.password-wrap{position:relative;}
.password-wrap input{padding-right:44px;}
.toggle-password{
  position:absolute;right:6px;top:50%;transform:translateY(-50%);
  width:32px;height:32px;border:0;border-radius:6px;background:transparent;color:var(--muted);
  display:grid;place-items:center;cursor:pointer;
}
.toggle-password:hover{background:var(--surf);color:var(--txt);}
.toggle-password svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
button[type=submit]{
  background:var(--acc);color:#000;border:none;border-radius:6px;
  padding:12px;font-size:13px;font-weight:700;cursor:pointer;
  font-family:var(--sans);transition:opacity .12s;margin-top:4px;
}
button[type=submit]:hover{opacity:.88;}
.error-box{
  background:rgba(224,92,92,.12);border:1px solid rgba(224,92,92,.3);
  color:var(--red);border-radius:6px;padding:10px 12px;font-size:12px;
  display:flex;align-items:center;gap:8px;
}
.card-footer{
  padding:14px 28px;border-top:1px solid var(--brd);
  font-size:11px;color:var(--muted);text-align:center;
}
.card-footer a{color:var(--acc);text-decoration:none;}
.card-footer a:hover{text-decoration:underline;}
</style>
</head>
<body>
<div class="card">
  <div class="card-header">
    <div class="logo-row">
      <span class="badge">PL</span>
      <span class="logo-text">Portal_Logistica</span>
    </div>
    <h1>Ingresar al portal</h1>
    <p>Accedé con tu usuario y contraseña.</p>
  </div>
  <div class="card-body">
    <form method="post" action="/login">
      {% if error %}
      <div class="error-box">⚠️ {{ error }}</div>
      {% endif %}
      <div>
        <label for="username">Usuario</label>
        <input id="username" name="username" type="text"
               autocomplete="username" autofocus required
               placeholder="tu usuario">
      </div>
      <div>
        <label for="password">Contraseña</label>
        <div class="password-wrap">
          <input id="password" name="password" type="password"
                 autocomplete="current-password" required
                 placeholder="••••••••">
          <button class="toggle-password" type="button" aria-label="Mostrar contraseña" aria-pressed="false" title="Mostrar contraseña">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>
      <button type="submit">Ingresar →</button>
    </form>
  </div>
  <div class="card-footer">
    Primera vez? <a href="/setup-inicial">Configurar usuario inicial</a>
  </div>
</div>
<script>
  const passwordInput = document.getElementById("password");
  const togglePassword = document.querySelector(".toggle-password");
  togglePassword.addEventListener("click", () => {
    const showing = passwordInput.type === "text";
    passwordInput.type = showing ? "password" : "text";
    togglePassword.setAttribute("aria-pressed", String(!showing));
    togglePassword.setAttribute("aria-label", showing ? "Mostrar contraseña" : "Ocultar contraseña");
    togglePassword.setAttribute("title", showing ? "Mostrar contraseña" : "Ocultar contraseña");
  });
</script>
</body>
</html>
