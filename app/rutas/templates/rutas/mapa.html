<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rutas de entrega · Del Palacio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="{{ url_for('rutas.static', filename='rutas/mapa.css') }}">
</head>
<body>
<div class="app">
<header>
  <h1>Clientes por día de entrega<small id="sub">Cargando…</small></h1>
  <nav class="topnav"><a href="{{ url_for('portal.portal_home') }}">Portal</a><a href="{{ url_for('rutas.mapa') }}" aria-current="page">Mapa</a></nav>
  <div class="hctl"><button class="btn" id="refreshView">Actualizar vista</button>
    <label for="assignedDays">Días asignados <select id="assignedDays"><option value="todos">Todos</option><option value="si">Sí</option><option value="no">No</option></select></label>
    <label for="activeClients">Activos <select id="activeClients"><option value="si">Sí</option><option value="no">No</option><option value="todos">Todos</option></select></label>
    <div class="seg" id="sucSeg" role="group" aria-label="Sucursal que entrega"></div>
    <div class="seg" id="daySeg" role="group" aria-label="Día de entrega"></div>
    <div class="seg" id="verSeg" role="group" aria-label="Color de los puntos"></div>
    <input type="search" id="q" placeholder="Buscar cliente, nº o calle" aria-label="Buscar cliente">
  </div>
</header>
<div class="main">
  <aside>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="t-loc" aria-selected="true">Localidades</button>
      <button class="tab" role="tab" id="t-dia" aria-selected="false">Clientes por día</button>
      <button class="tab" role="tab" id="t-pen" aria-selected="false">Pendientes<span class="n" id="penN"></span></button>
      <button class="tab" role="tab" id="t-ven" aria-selected="false">Ventas</button>
      <button class="tab" role="tab" id="t-exp" aria-selected="false">Información</button>
    </div>
    <div class="pane" id="p-loc"></div>
    <div class="pane" id="p-dia" hidden></div>
    <div class="pane" id="p-pen" hidden></div>
    <div class="pane" id="p-ven" hidden></div>
    <div class="pane" id="p-exp" hidden></div>
  </aside>
  <div id="map"></div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
window.RUTAS = {
  api: "{{ url_for('rutas.api_datos') }}".replace(/\/datos$/, "")
};
</script>
<script src="{{ url_for('rutas.static', filename='rutas/vista.js') }}"></script>
<script src="{{ url_for('rutas.static', filename='rutas/mapa.js') }}"></script>
</body>
</html>
