<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rutas de entrega · Del Palacio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="{{ url_for('rutas.static', filename='rutas/mapa.css') }}">
</head>
<body>
<div class="app">
<header class="topbar">
  <div class="brand">
    <h1>Rutas de entrega<small id="sub" aria-live="polite">Cargando…</small></h1>
    <nav class="topnav" aria-label="Secciones">
      <a href="{{ url_for('portal.portal_home') }}">Portal</a>
      <a href="{{ url_for('rutas.mapa') }}" aria-current="page">Mapa</a>
      <a href="{{ url_for('rutas.plan_page') }}">Camiones</a>
      <a href="{{ url_for('rutas_importaciones.importar_dias_page') }}">Importar días</a>
    </nav>
  </div>
  <div class="hctl">
    <div class="fld"><span id="lblSuc">Sucursal</span><div class="seg" id="sucSeg" role="group" aria-labelledby="lblSuc"></div></div>
    <div class="fld"><span id="lblDia">Día de entrega</span><div class="seg seg-days" id="daySeg" role="group" aria-labelledby="lblDia"></div></div>
    <div class="fld"><span id="lblVer">Color por</span><div class="seg" id="verSeg" role="group" aria-labelledby="lblVer"></div></div>
    <div class="fld"><label for="q">Buscar</label><input type="search" id="q" placeholder="Cliente, nº o calle   /" autocomplete="off"></div>
    <details class="more">
      <summary class="btn">Filtros</summary>
      <div class="more-body">
        <label for="activeClients">Clientes <select id="activeClients"><option value="si">Solo activos</option><option value="no">Solo inactivos</option><option value="todos">Todos</option></select></label>
        <label for="assignedDays">Días asignados <select id="assignedDays"><option value="todos">Con y sin días</option><option value="si">Con días</option><option value="no">Sin días</option></select></label>
        <button class="btn" id="refreshView" type="button">Recargar datos</button>
      </div>
    </details>
  </div>
</header>
<div class="main">
  <aside>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="t-loc" aria-selected="true">Localidades</button>
      <button class="tab" role="tab" id="t-dia" aria-selected="false">Clientes</button>
      <button class="tab" role="tab" id="t-pen" aria-selected="false">Pendientes<span class="n" id="penN"></span></button>
      <button class="tab" role="tab" id="t-ven" aria-selected="false">Ventas</button>
      <button class="tab" role="tab" id="t-exp" aria-selected="false">Ayuda</button>
    </div>
    <div class="pane" id="p-loc"></div>
    <div class="pane" id="p-dia" hidden></div>
    <div class="pane" id="p-pen" hidden></div>
    <div class="pane" id="p-ven" hidden></div>
    <div class="pane" id="p-exp" hidden></div>
  </aside>
  <div id="map" aria-label="Mapa de clientes"></div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
window.RUTAS = {
  api: "{{ url_for('rutas.api_datos') }}".replace(/\/datos$/, "")
};
</script>
<script src="{{ url_for('rutas.static', filename='rutas/vista.js') }}"></script>
<script src="{{ url_for('rutas.static', filename='rutas/mapa.js') }}"></script>
</body>
</html>
