<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rutas de entrega · Del Palacio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="{{ url_for('rutas.static', filename='rutas/mapa.css') }}">
</head>
<body>
<div class="app">
<header class="topbar">
  <div class="brand">
    <a class="back" href="{{ url_for('portal.portal_home') }}" title="Volver al portal" aria-label="Volver al portal">←</a>
    <h1>Rutas de entrega<small id="sub" aria-live="polite">Cargando…</small></h1>
  </div>
  <div class="hctl">
    <div class="seg" id="sucSeg" role="group" aria-label="Sucursal que entrega"></div>
    <div class="days-wrap">
      <div class="seg seg-days" id="daySeg" role="group" aria-label="Día de entrega"></div>
      <button type="button" class="btn btn-comp" id="compBtn" aria-pressed="false" title="Elegir varios días y ver si sus zonas se superponen en cada localidad (también Ctrl+clic en un día)">Comparar</button>
    </div>
    <div class="seg" id="verSeg" role="group" aria-label="Color de los puntos"></div>
    <div class="buscar">
      <input type="search" id="q" placeholder="Cliente o dirección   /" aria-label="Buscar cliente o dirección (calle altura, localidad)" autocomplete="off"
             role="combobox" aria-expanded="false" aria-controls="qDrop" aria-autocomplete="list">
      <div class="qdrop" id="qDrop" role="listbox" aria-label="Resultados de la búsqueda" hidden></div>
    </div>
    <details class="more">
      <summary class="btn" aria-label="Menú y filtros" title="Menú y filtros">☰</summary>
      <div class="more-body">
        <nav class="menu-nav" aria-label="Secciones">
          <a href="{{ url_for('rutas.mapa') }}" aria-current="page">Mapa de clientes</a>
          <a href="{{ url_for('rutas.plan_page') }}">Camiones y localidades</a>
          <a href="{{ url_for('rutas_importaciones.importar_dias_page') }}">Importar días de entrega</a>
          <a href="{{ url_for('rutas_importaciones.importar_rutas_page') }}">Importar rutas por camión</a>
          <a href="{{ url_for('portal.portal_home') }}">Volver al portal</a>
        </nav>
        <hr>
        <label for="activeClients">Clientes <select id="activeClients"><option value="si">Solo activos</option><option value="no">Solo inactivos</option><option value="todos">Todos</option></select></label>
        <label for="assignedDays">Días asignados <select id="assignedDays"><option value="todos">Con y sin días</option><option value="si">Con días</option><option value="no">Sin días</option></select></label>
        <button class="btn" id="refreshView" type="button">Recargar datos</button>
      </div>
    </details>
  </div>
</header>
<div class="main" id="main">
  <aside id="aside">
    <div class="resizer" id="resizer" role="separator" aria-orientation="vertical" aria-label="Ancho del panel" aria-valuemin="300" tabindex="0"
         title="Arrastrá para cambiar el ancho del panel · doble clic: ancho original"></div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="t-cer" aria-selected="false" title="Clientes cerca del punto buscado y sus días de entrega" hidden>Cerca</button>
      <button class="tab" role="tab" id="t-loc" aria-selected="true">Localidades</button>
      <button class="tab" role="tab" id="t-dia" aria-selected="false">Clientes</button>
      <button class="tab" role="tab" id="t-pen" aria-selected="false">Pendientes<span class="n" id="penN"></span></button>
      <button class="tab" role="tab" id="t-rec" aria-selected="false" title="Recorridos por camión y clientes por día y localidad">Recorridos</button>
      <button class="tab" role="tab" id="t-rev" aria-selected="false" title="Revisión de días de entrega: análisis e informe">Revisión</button>
      <button class="tab" role="tab" id="t-ven" aria-selected="false">Ventas</button>
      <button class="tab" role="tab" id="t-exp" aria-selected="false" title="Ayuda">?</button>
    </div>
    <div class="pane" id="p-cer" hidden></div>
    <div class="pane" id="p-loc"></div>
    <div class="pane" id="p-dia" hidden></div>
    <div class="pane" id="p-pen" hidden></div>
    <div class="pane" id="p-rec" hidden></div>
    <div class="pane" id="p-rev" hidden></div>
    <div class="pane" id="p-ven" hidden></div>
    <div class="pane" id="p-exp" hidden></div>
  </aside>
  <div id="map" aria-label="Mapa de clientes"></div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
window.RUTAS = {
  api: "{{ url_for('rutas.api_datos') }}".replace(/\/datos$/, ""),
  importarRutas: "{{ url_for('rutas_importaciones.importar_rutas_page') }}"
};
</script>
<script src="{{ url_for('rutas.static', filename='rutas/vista.js') }}"></script>
<script src="{{ url_for('rutas.static', filename='rutas/revision.js') }}"></script>
<script src="{{ url_for('rutas.static', filename='rutas/mapa.js') }}"></script>
</body>
</html>
